[package]
name = "attested-receiver"
version = "0.0.3"
edition = "2021"
description = "Verify Circle CCTP V2 attestations and read attested hookData inside Soroban contracts"
license = "MIT"

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
# soroban-env-host 22.1.3 declares ed25519-dalek ">=2.0.0"; cargo resolves 3.x,
# whose API its own testutils doesn't compile against. Cap to 2.x.
ed25519-dalek = "=2.2.0"
